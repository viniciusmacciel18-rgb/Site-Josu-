<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title description">
  <title id="title">Burguer Feitoza — artesanal de verdade</title>
  <desc id="description">Arte promocional com dois hambúrgueres artesanais ilustrados, sobrepostos e marcados na grelha, sobre fundo verde-escuro.</desc>
